name: Deploy DeepGuard Text Detector to Hugging Face

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "hf_space/**"
      - ".github/workflows/deploy-text-space.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Hugging Face Hub
        run: python -m pip install --upgrade huggingface_hub

      - name: Upload Gradio Space files
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "Missing HF_TOKEN GitHub Actions secret."
            exit 1
          fi
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          api.upload_folder(
              folder_path="hf_space",
              repo_id="shikra99/deepguard-text-detector",
              repo_type="space",
              path_in_repo="",
              commit_message="Deploy DeepGuard Gradio ZeroGPU text detector",
          )
          print("Gradio Space files uploaded.")
          PY
