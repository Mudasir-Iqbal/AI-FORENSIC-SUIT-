name: Deploy DeepGuard Backend to Modal

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/modal-deploy.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate backend Python syntax
        run: |
          python -m py_compile backend/app.py backend/video_forensics.py

      - name: Install Modal
        run: |
          python -m pip install --upgrade pip
          pip install modal

      - name: Deploy FastAPI application
        run: modal deploy backend/modal_app.py

      - name: Verify deployed Modal routes
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request

          base = "https://mudasir-iqbal--deepguard-api-create-api.us-east.modal.run"
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(base + "/openapi.json", timeout=30) as response:
                      if response.status != 200:
                          raise RuntimeError(f"OpenAPI returned HTTP {response.status}")
                      schema = json.load(response)
                  paths = schema.get("paths", {})
                  required = ["/health", "/video-forensics", "/video-forensics/stream"]
                  missing = [path for path in required if path not in paths]
                  if missing:
                      raise RuntimeError(f"Deployed Modal app is missing routes: {missing}")
                  print("Modal OpenAPI route check passed:")
                  for path in required:
                      print(f"  {path}")
                  break
              except Exception as exc:
                  print(f"Modal route check attempt {attempt + 1}/12 failed: {exc}")
                  if attempt == 11:
                      raise
                  time.sleep(10)
          PY
