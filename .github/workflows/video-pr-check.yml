name: Video Pipeline PR Checks

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/video-pr-check.yml"

permissions:
  contents: read

jobs:
  backend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile backend modules
        run: python -m py_compile backend/app.py backend/video_forensics.py backend/face_preprocessing.py
      - name: Install and smoke-test face preprocessing dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mediapipe==0.10.21 opencv-python-headless==4.10.0.84 numpy==1.26.4
          python -c "import cv2, mediapipe as mp, numpy; assert hasattr(mp, 'solutions') and hasattr(mp.solutions, 'face_mesh'); print('MediaPipe Face Mesh ready', mp.__version__, cv2.__version__, numpy.__version__)"

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build
