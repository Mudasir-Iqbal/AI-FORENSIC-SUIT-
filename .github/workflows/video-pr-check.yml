name: Video Pipeline PR Checks

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/video-pr-check.yml"

permissions:
  contents: read

jobs:
  backend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile backend modules
        run: python -m py_compile backend/app.py backend/video_forensics.py backend/face_preprocessing.py backend/yunet_preprocessing.py backend/detector_parity_benchmark.py backend/modal_gend_app.py
      - name: Run detector parity benchmark unit tests
        run: python -m unittest discover -s backend/tests -p "test_*.py" -v
      - name: Install and smoke-test face preprocessing dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mediapipe==0.10.21 numpy==1.26.4
          python -c "import cv2, mediapipe as mp, numpy; assert hasattr(mp, 'solutions') and hasattr(mp.solutions, 'face_mesh'); assert hasattr(cv2, 'FaceDetectorYN_create'); print('MediaPipe and YuNet APIs ready', mp.__version__, cv2.__version__, numpy.__version__)"

      - name: Verify pinned YuNet model and run CPU inference smoke test
        run: |
          curl -fsSL "https://huggingface.co/opencv/opencv_zoo/resolve/d4938dfc9d4ec5d098bfa33e98b3f3345a236586/models/face_detection_yunet/face_detection_yunet_2023mar.onnx" -o /tmp/face_detection_yunet_2023mar.onnx
          echo "8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4  /tmp/face_detection_yunet_2023mar.onnx" | sha256sum -c -
          python -c "import cv2, numpy as np; detector=cv2.FaceDetectorYN_create('/tmp/face_detection_yunet_2023mar.onnx', '', (320, 320), 0.5, 0.3, 5000); detector.setInputSize((320, 320)); _, faces=detector.detect(np.zeros((320, 320, 3), dtype=np.uint8)); print('YuNet ONNX CPU inference loaded; detections:', 0 if faces is None else len(faces))"

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build
