name: Deploy Isolated GenD Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/modal_gend_app.py"
      - ".github/workflows/gend-deploy.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      GEND_MODEL_REVISION: main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate isolated worker syntax and safety checks
        run: |
          python -m py_compile backend/modal_gend_app.py
          python -m unittest backend.tests.test_gend_runtime -v
      - name: Install Modal CLI
        run: |
          python -m pip install --upgrade pip
          pip install modal
      - name: Deploy isolated GenD worker
        run: modal deploy backend/modal_gend_app.py
