name: Text Model Load Test

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/app.py"
      - "backend/requirements.txt"
      - ".github/workflows/text-model-smoke-test.yml"

jobs:
  load-and-infer:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install fastapi==0.115.0 "uvicorn[standard]==0.30.6" transformers==4.48.2 safetensors==0.4.5 pydantic==2.9.2

      - name: Download checkpoint, load model, and run inference
        working-directory: backend
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          HF_HUB_ENABLE_HF_TRANSFER: "0"
        run: |
          python - <<'PY'
          import time
          import torch
          from transformers import AutoTokenizer
          from app import DesklibAIDetectionModel, MODEL_ID

          print(f"Model: {MODEL_ID}")
          print(f"PyTorch: {torch.__version__}")
          print(f"Device: CPU")
          start = time.perf_counter()

          tokenizer = AutoTokenizer.from_pretrained(MODEL_ID)
          print("Tokenizer loaded.")

          model, loading_info = DesklibAIDetectionModel.from_pretrained(
              MODEL_ID,
              output_loading_info=True,
          )
          model.eval()
          print("Checkpoint loaded into model.")

          missing = loading_info.get("missing_keys", [])
          unexpected = loading_info.get("unexpected_keys", [])
          mismatched = loading_info.get("mismatched_keys", [])
          print(f"Missing keys: {len(missing)}")
          print(f"Unexpected keys: {len(unexpected)}")
          print(f"Mismatched keys: {len(mismatched)}")

          if missing or unexpected or mismatched:
              print("Missing key sample:", missing[:10])
              print("Unexpected key sample:", unexpected[:10])
              print("Mismatched key sample:", mismatched[:10])
              raise RuntimeError("Checkpoint weights do not fully match the model architecture.")

          sample = "This is a short sample paragraph used to verify that the text classification model loads and performs inference."
          inputs = tokenizer(
              sample,
              truncation=True,
              max_length=512,
              return_tensors="pt",
          )

          with torch.inference_mode():
              logits = model(**inputs)["logits"]
              probability = torch.sigmoid(logits.reshape(-1)[0]).item()

          if not 0.0 <= probability <= 1.0:
              raise RuntimeError(f"Invalid model probability: {probability}")

          elapsed = time.perf_counter() - start
          print(f"Smoke-test probability: {probability:.6f}")
          print(f"Total load + inference time: {elapsed:.2f} seconds")
          print("SUCCESS: model loaded and inference completed.")
          PY
